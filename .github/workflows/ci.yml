name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check warden tests

      # No cloud credentials, no API key, no cost. The governance layer is
      # testable offline by design — that is the point of the fake estate.
      - name: Test
        run: pytest -q

      # The security gate. If a manifest edit ever grants an agent a
      # cluster-mutating tool, this fails the build rather than shipping it.
      - name: Assert no agent can write to the cluster
        run: python -m warden.probe --assert-no-cluster-writes

      - name: Full incident, end to end
        run: python -m warden.agents.demo
